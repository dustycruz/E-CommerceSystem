openapi: 3.0.3
info:
  title: ECommerceSystem Orders API
  version: '1.0'
  description: |
    Order Service of the E-CommerceSystem midterm project. Owns orders and runs the saga orchestrator
    (database ECommerceOrderDb).

    Placing an order (POST /orders/v1/orders):
    1. Every line is validated synchronously against the Catalog API. Prices always come from the Catalog,
       never from the client. Unknown product -> 400, inactive product -> 422, Catalog unavailable after
       retries -> 503.
    2. The order (status Pending) and an OrderPlaced outbox message are saved in one local transaction.
    3. The API answers 202 Accepted with a Location header. The rest of the saga (stock reservation,
       payment, compensation) runs asynchronously; poll GET /orders/v1/orders/{id} to follow it.

    Test cards: 4242424242424242 is charged, 4000000000000002 is declined.
    simulateFailureAfterPayment = true forces a full compensation (refund, release stock, cancel).

    Conventions:
    - URI versioning: every path starts with /orders/v1.
    - Errors are RFC 9457 Problem Details (application/problem+json) with "correlationId" and "traceId".
    - Correlation: optional X-Correlation-ID request header (the Storefront always sends one). It is echoed
      in the response header, stored on the order, carried by every RabbitMQ message and logged everywhere.
  contact:
    name: Dusty Cruz (GitHub dustycruz)
servers:
  - url: http://localhost:5002
    description: Local development (HTTP only)
tags:
  - name: Orders
    description: Place, read, update and delete orders.
paths:
  /orders/v1/orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders
      description: Newest first. Filter by customerEmail for the Storefront "My orders" page.
      parameters:
        - name: customerEmail
          in: query
          required: false
          description: Only orders of this customer (case-insensitive).
          schema:
            type: string
            format: email
            maxLength: 200
      responses:
        '200':
          description: The orders (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Orders
      operationId: placeOrder
      summary: Place an order (starts the saga)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '202':
          description: The order was accepted with status Pending. The saga continues asynchronously.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      operationId: getOrderById
      summary: Get one order with its items and saga timeline
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Orders
      operationId: updateOrder
      summary: Update the customer details of a Pending order
      description: Only allowed while the order is Pending; otherwise 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Delete a finished order
      description: Only Confirmed or Cancelled orders can be deleted; an order whose saga is still running returns 409.
      responses:
        '204':
          description: The order was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order id.
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: URL of the created order.
      schema:
        type: string
        format: uri
  responses:
    BadRequest:
      description: The request is invalid (field validation, or an unknown product id in items).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: The order does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The order is in a state that does not allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: The request is valid but cannot be processed (for example an inactive product).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: A downstream service (Catalog) is unavailable after all retries. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: An unexpected error occurred. Details are logged with the correlation id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    OrderStatus:
      type: string
      enum:
        - Pending
        - StockReserved
        - PaymentProcessing
        - Confirmed
        - Cancelled
    PlaceOrderRequest:
      type: object
      required:
        - customerName
        - customerEmail
        - cardNumber
        - items
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan Dela Cruz
        customerEmail:
          type: string
          format: email
          maxLength: 200
          example: juan@example.com
        cardNumber:
          type: string
          pattern: '^[0-9]{16}$'
          description: Test card number. 4242424242424242 succeeds, 4000000000000002 is declined.
          example: '4242424242424242'
        simulateFailureAfterPayment:
          type: boolean
          default: false
          description: Demo switch. After a successful charge the saga refunds, releases stock and cancels.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlaceOrderItemRequest'
    PlaceOrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int32
          minimum: 1
          example: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 1
    UpdateOrderRequest:
      type: object
      required:
        - customerName
        - customerEmail
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan P. Dela Cruz
        customerEmail:
          type: string
          format: email
          maxLength: 200
          example: juan@example.com
    OrderResponse:
      type: object
      required:
        - id
        - customerName
        - customerEmail
        - status
        - totalAmount
        - currency
        - cardLast4
        - correlationId
        - simulateFailureAfterPayment
        - createdAtUtc
        - updatedAtUtc
        - items
        - history
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerEmail:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
          format: decimal
          example: 4798.00
        currency:
          type: string
          example: PHP
        cardLast4:
          type: string
          example: '4242'
        failureReason:
          type: string
          nullable: true
          example: Payment declined by the card issuer.
        paymentId:
          type: string
          format: uuid
          nullable: true
        correlationId:
          type: string
          example: 7d9f2c1e8a3b4f6e9c0d1a2b3c4d5e6f
        simulateFailureAfterPayment:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistoryResponse'
    OrderItemResponse:
      type: object
      required:
        - productId
        - sku
        - productName
        - unitPrice
        - quantity
        - lineTotal
      properties:
        productId:
          type: integer
          format: int32
        sku:
          type: string
        productName:
          type: string
        unitPrice:
          type: number
          format: decimal
        quantity:
          type: integer
          format: int32
        lineTotal:
          type: number
          format: decimal
    OrderStatusHistoryResponse:
      type: object
      required:
        - status
        - description
        - occurredAtUtc
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        description:
          type: string
          example: Stock reserved by the Inventory Service.
        occurredAtUtc:
          type: string
          format: date-time
    OrderSummaryResponse:
      type: object
      required:
        - id
        - customerName
        - customerEmail
        - status
        - totalAmount
        - currency
        - itemCount
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerEmail:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
          format: decimal
        currency:
          type: string
        itemCount:
          type: integer
          format: int32
        failureReason:
          type: string
          nullable: true
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details. Extension members correlationId and traceId are always present.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    ValidationProblemDetails:
      type: object
      description: Problem Details for 400 responses. errors maps each invalid field to its messages.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}