openapi: 3.0.3
info:
  title: ECommerceSystem Catalog API
  version: '1.0'
  description: |
    Catalog Service of the E-CommerceSystem midterm project. Owns the products (database ECommerceCatalogDb).

    Conventions:
    - URI versioning: every path starts with /catalog/v1.
    - Errors are RFC 9457 Problem Details (application/problem+json). Every error also contains the
      extension members "correlationId" and "traceId".
    - Correlation: send an optional X-Correlation-ID request header. The service creates one when it is
      missing, returns it in the X-Correlation-ID response header and writes it on every log line.
    - Prices are in PHP with 2 decimals.
  contact:
    name: Laurence Mirandilla (GitHub LaurenceMirandilla)
servers:
  - url: http://localhost:5001
    description: Local development (HTTP only)
tags:
  - name: Products
    description: Create, read, update and delete catalog products.
  - name: Chaos
    description: Development-only fault injection used for the retry demo.
paths:
  /catalog/v1/products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: List products
      description: Returns active products ordered by name. Use includeInactive=true to also return inactive products.
      parameters:
        - name: category
          in: query
          required: false
          description: Only return products in this category (case-insensitive exact match).
          schema:
            type: string
            maxLength: 60
        - name: includeInactive
          in: query
          required: false
          description: Also return inactive products. Default false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The list of products (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Products
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: The product was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalog/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags:
        - Products
      operationId: getProductById
      summary: Get one product by id
      description: Used synchronously by the Order Service (generated NSwag client) to validate order lines and read prices.
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Replace a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Products
      operationId: deleteProduct
      summary: Delete a product
      responses:
        '204':
          description: The product was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalog/v1/chaos:
    post:
      tags:
        - Chaos
      operationId: configureChaos
      summary: Make the next N product lookups fail with 503 (Development only)
      description: |
        Fault injection for the retry demo. After calling this with failNextRequests = 2, the next 2 calls to
        GET /catalog/v1/products/{id} return 503 Service Unavailable. Send 0 to reset.
        Only available when the service runs in the Development environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChaosRequest'
      responses:
        '200':
          description: Chaos settings applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChaosResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product id.
      schema:
        type: integer
        format: int32
        minimum: 1
  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri
  responses:
    BadRequest:
      description: The request is invalid. The errors member lists each invalid field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The request conflicts with the current state (for example a duplicate SKU).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: The service is temporarily unavailable (chaos mode or dependency outage). Safe to retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: An unexpected error occurred. Details are logged with the correlation id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProductResponse:
      type: object
      required:
        - id
        - sku
        - name
        - description
        - category
        - price
        - currency
        - imageUrl
        - isActive
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: integer
          format: int32
          example: 1
        sku:
          type: string
          example: SKU-KBD-001
        name:
          type: string
          example: Mechanical Keyboard
        description:
          type: string
          example: Tenkeyless mechanical keyboard with hot-swappable brown switches and white backlight.
        category:
          type: string
          example: Peripherals
        price:
          type: number
          format: decimal
          example: 3499.00
        currency:
          type: string
          example: PHP
        imageUrl:
          type: string
          example: https://placehold.co/600x400/png?text=Mechanical+Keyboard
        isActive:
          type: boolean
          example: true
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required:
        - sku
        - name
        - category
        - price
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: SKU-TAB-009
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Graphics Tablet
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: 10-inch pen tablet with 8192 pressure levels.
        category:
          type: string
          minLength: 1
          maxLength: 60
          example: Peripherals
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 1000000
          example: 2799.00
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          example: https://placehold.co/600x400/png?text=Graphics+Tablet
        isActive:
          type: boolean
          default: true
    UpdateProductRequest:
      type: object
      required:
        - sku
        - name
        - category
        - price
        - isActive
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: SKU-KBD-001
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Mechanical Keyboard
        description:
          type: string
          maxLength: 1000
          nullable: true
        category:
          type: string
          minLength: 1
          maxLength: 60
          example: Peripherals
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 1000000
          example: 3299.00
        imageUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        isActive:
          type: boolean
          example: true
    ChaosRequest:
      type: object
      required:
        - failNextRequests
      properties:
        failNextRequests:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 2
    ChaosResponse:
      type: object
      required:
        - failNextRequests
        - message
      properties:
        failNextRequests:
          type: integer
          format: int32
          example: 2
        message:
          type: string
          example: The next 2 product lookup(s) will return 503.
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details. Extension members correlationId and traceId are always present.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    ValidationProblemDetails:
      type: object
      description: Problem Details for 400 responses. errors maps each invalid field to its messages.
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}